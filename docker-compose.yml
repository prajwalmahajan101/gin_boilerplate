services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gin_boilerplate
      POSTGRES_PASSWORD: gin_boilerplate
      POSTGRES_DB: gin_boilerplate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gin_boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "local"
      DATABASE_URL: "postgres://gin_boilerplate:gin_boilerplate@postgres:5432/gin_boilerplate?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
