basePath: /api/v1
definitions:
  auth.adminUpdateReq:
    properties:
      is_active:
        type: boolean
      role:
        type: string
    type: object
  auth.changePasswordReq:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.createKeyReq:
    properties:
      expires_at:
        type: string
      name:
        type: string
      user_id:
        type: integer
    required:
    - name
    type: object
  auth.loginReq:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.logoutReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.refreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.registerReq:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  items.createReq:
    properties:
      code:
        type: string
      name:
        type: string
      notes:
        type: object
    required:
    - code
    - name
    type: object
  items.updateReq:
    properties:
      name:
        type: string
      notes:
        type: object
    type: object
  response.Envelope:
    properties:
      data: {}
      errors:
        items:
          $ref: '#/definitions/response.ErrDetail'
        type: array
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  response.ErrDetail:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      field:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: Modular monolith boilerplate API.
  title: gin_boilerplate API
  version: 0.1.0
paths:
  /admin/api-keys:
    get:
      parameters:
      - description: user id
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List API keys by user (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: key details (user_id required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.createKeyReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Create API key for any user (admin)
      tags:
      - admin
  /admin/api-keys/{id}:
    delete:
      parameters:
      - description: api key id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Revoke API key (admin)
      tags:
      - admin
  /admin/users:
    get:
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List users (admin)
      tags:
      - admin
  /admin/users/{id}:
    delete:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Soft-delete user (admin)
      tags:
      - admin
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get user by ID (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.adminUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Update user role or status (admin)
      tags:
      - admin
  /auth/api-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List own API keys
      tags:
      - auth
    post:
      consumes:
      - application/json
      parameters:
      - description: key details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.createKeyReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Create API key for self
      tags:
      - auth
  /auth/api-keys/{id}:
    delete:
      parameters:
      - description: api key id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Revoke own API key
      tags:
      - auth
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: old and new passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Change password (authenticated)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.logoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log out (revoke tokens)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Refresh token pair
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Register a new user
      tags:
      - auth
  /items:
    get:
      parameters:
      - description: page number
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List items
      tags:
      - items
    post:
      consumes:
      - application/json
      parameters:
      - description: item to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/items.createReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Create item
      tags:
      - items
  /items/{id}:
    delete:
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Soft-delete item
      tags:
      - items
    get:
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Get item by ID
      tags:
      - items
    patch:
      consumes:
      - application/json
      parameters:
      - description: item id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/items.updateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Update item
      tags:
      - items
swagger: "2.0"
